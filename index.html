<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AliRaza Converter</title>
    <!-- Links the app identity description matrix for Android installation -->
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #1e293b;
            border: 2px solid #334155;
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #22d3ee;
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .file-box {
            border: 2px dashed #475569;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        .file-box:hover {
            border-color: #38bdf8;
        }

        input[type="file"] {
            display: none;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-bottom: 15px;
        }

        .btn-select {
            background-color: #38bdf8;
            color: #0f172a;
        }

        .btn-select:hover { background-color: #7dd3fc; }

        .btn-convert {
            background-color: #22c55e;
            color: #ffffff;
        }

        .btn-convert:hover { background-color: #4ade80; }
        .btn-convert:disabled {
            background-color: #475569;
            color: #94a3b8;
            cursor: not-allowed;
        }

        .status {
            color: #cbd5e1;
            font-size: 14px;
            margin-top: 15px;
            font-style: italic;
        }

        #downloadLink {
            display: inline-block;
            margin-top: 20px;
            color: #22d3ee;
            text-decoration: none;
            font-weight: bold;
            border-bottom: 2px solid #22d3ee;
            padding-bottom: 2px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>AliRaza Converter</h1>
        <div class="subtitle">Offline Native Video-to-Audio Matrix</div>

        <div class="file-box" onclick="document.getElementById('videoInput').click()">
            <span id="fileNameDisplay">Tap here to choose a video file</span>
            <input type="file" id="videoInput" accept="video/*">
        </div>

        <button id="convertBtn" class="btn btn-convert" disabled>Convert to Audio (WAV)</button>

        <div id="statusDisplay" class="status">Status: Waiting for file selection...</div>
        
        <a id="downloadLink" style="display: none;">Download Extracted Audio</a>
    </div>

    <script>
        let selectedFile = null;

        // Listen for user picking a media file
        document.getElementById('videoInput').addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                document.getElementById('fileNameDisplay').innerText = selectedFile.name;
                document.getElementById('convertBtn').disabled = false;
                document.getElementById('statusDisplay').innerText = "Status: File ready for processing.";
            }
        });

        // Local processing calculation architecture
        document.getElementById('convertBtn').addEventListener('click', async function() {
            if (!selectedFile) return;

            const status = document.getElementById('statusDisplay');
            const downloadLink = document.getElementById('downloadLink');
            const convertBtn = this;

            try {
                convertBtn.disabled = true;
                status.innerText = "Processing: Reading local file array storage...";
                downloadLink.style.display = "none";

                // Read file streams natively on hardware RAM sticks
                const fileReader = new FileReader();
                fileReader.onload = async function(event) {
                    try {
                        status.innerText = "Processing: Decoding local audio frequencies...";
                        const arrayBuffer = event.target.result;
                        
                        // Initialize local audio pipeline architecture
                        const AudioContext = window.AudioContext || window.webkitAudioContext;
                        const audioCtx = new AudioContext();
                        
                        audioCtx.decodeAudioData(arrayBuffer, function(audioBuffer) {
                            status.innerText = "Processing: Compiling offline WAV container architecture...";
                            
                            // Convert the raw memory bits into an offline WAV asset
                            const wavBlob = audioBufferToWav(audioBuffer);
                            const blobUrl = URL.createObjectURL(wavBlob);
                            
                            // Present download payload
                            downloadLink.href = blobUrl;
                            downloadLink.download = selectedFile.name.split('.')[0] + ".wav";
                            downloadLink.style.display = "inline-block";
                            
                            status.innerText = "Success: Audio extracted completely offline!";
                            convertBtn.disabled = false;
                        }, function(err) {
                            status.innerText = "Error: System failed to decode media format.";
                            convertBtn.disabled = false;
                        });
                    } catch (e) {
                        status.innerText = "Error during compilation: " + e.message;
                        convertBtn.disabled = false;
                    }
                };
                
                fileReader.readAsArrayBuffer(selectedFile);

            } catch (err) {
                status.innerText = "Error: " + err.message;
                convertBtn.disabled = false;
            }
        });

        // Standard sub-matrix script to output raw PCM channel configurations to standalone WAV structure
        function audioBufferToWav(buffer) {
            let numOfChan = buffer.numberOfChannels,
                length = buffer.length * numOfChan * 2 + 44,
                bufferArr = new ArrayBuffer(length),
                view = new DataView(bufferArr),
                channels = [], i, sample,
                offset = 0,
                pos = 0;

            function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
            function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }

            setUint32(0x46464952); // "RIFF"
            setUint32(length - 8); // file length - 8
            setUint32(0x45564157); // "WAVE"
            setUint32(0x20746d66); // "fmt " chunk
            setUint32(16);         // chunk length
            setUint16(1);          // sample format (raw PCM)
            setUint16(numOfChan);
            setUint32(buffer.sampleRate);
            setUint32(buffer.sampleRate * 2 * numOfChan); // byte rate
            setUint16(numOfChan * 2);                     // block align
            setUint16(16);                                // bits per sample

            setUint32(0x61746164); // "data" chunk
            setUint32(length - pos - 4);

            for (i = 0; i < buffer.numberOfChannels; i++) channels.push(buffer.getChannelData(i));

            while (pos < length) {
                for (i = 0; i < numOfChan; i++) {
                    sample = Math.max(-1, Math.min(1, channels[i][offset]));
                    sample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
                    view.setInt16(pos, sample, true); pos += 2;
                }
                offset++;
            }
            return new Blob([bufferArr], { type: 'audio/wav' });
        }

        // Register the background Service Worker pipeline matrix for full offline performance execution
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('PWA Service Worker registered successfully.'))
                    .catch(err => console.log('PWA Service Worker registration failed.', err));
            });
        }
    </script>
</body>
</html>
