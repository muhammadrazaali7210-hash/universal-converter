<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS QUANTUM CORE</title>
    <!-- Core External Processing Engines -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/imagetracerjs@1.2.6/imagetracer.min.js"></script>
    <style>
        :root {
            --bg-deep: #0a1128;
            --panel-bg: #131c38;
            --accent-cyan: #00f2fe;
            --accent-blue: #0072ff;
            --text-main: #ffffff;
            --text-dim: #7080b0;
            --border-glow: #1e3a8a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .quantum-container {
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        h1 {
            color: var(--accent-cyan);
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 6px;
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 14px;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .control-panel {
            background-color: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        .upload-zone {
            border: 2px dashed #1d4ed8;
            background-color: rgba(10, 17, 40, 0.4);
            border-radius: 12px;
            padding: 35px 20px;
            margin-bottom: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .upload-zone:hover {
            border-color: var(--accent-cyan);
            background-color: rgba(0, 242, 254, 0.03);
        }

        .upload-text {
            color: var(--text-main);
            font-size: 16px;
            line-height: 1.5;
        }

        .upload-subtext {
            display: block;
            color: var(--accent-cyan);
            font-weight: 600;
            margin-top: 5px;
        }

        input[type="file"] {
            display: none;
        }

        .selector-label {
            display: block;
            text-align: left;
            color: var(--text-dim);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .custom-select {
            width: 100%;
            padding: 14px 16px;
            background-color: #0b1126;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg fill='%237080b0' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
            background-repeat: no-repeat;
            background-position: right 12px center;
            margin-bottom: 25px;
            cursor: pointer;
        }

        /* Upgraded Progress Bar Interface */
        .progress-container {
            width: 100%;
            background-color: #0b1126;
            border-radius: 6px;
            height: 16px;
            margin-bottom: 20px;
            overflow: hidden;
            display: none;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-blue) 0%, var(--accent-cyan) 100%);
            box-shadow: 0 0 10px var(--accent-cyan);
            transition: width 0.1s ease;
        }

        .progress-text {
            position: absolute;
            width: 100%;
            top: 0;
            left: 0;
            font-size: 11px;
            font-weight: bold;
            line-height: 16px;
            color: #ffffff;
            text-shadow: 1px 1px 2px #000;
            text-align: center;
        }

        .btn-compile {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #0072ff 0%, #00f2fe 100%);
            border: none;
            border-radius: 10px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.3);
            transition: transform 0.1s ease, opacity 0.2s;
        }

        .btn-compile:hover { opacity: 0.95; }
        .btn-compile:disabled { background: #334155; cursor: not-allowed; }

        .status-box {
            width: 100%;
            background-color: #050b1a;
            border: 1px solid var(--accent-cyan);
            border-radius: 10px;
            padding: 12px;
            margin-top: 20px;
            color: var(--accent-cyan);
            font-family: monospace;
            font-size: 14px;
            letter-spacing: 1px;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="quantum-container">
        <h1>JARVIS QUANTUM CORE</h1>
        <div class="subtitle">Maximum Capacity Media Engine</div>

        <div class="control-panel">
            <div class="upload-zone" onclick="document.getElementById('quantumFiles').click()">
                <div class="upload-text" id="uploadDisplay">
                    Tap to Initialize Target Asset Streams
                    <span class="upload-subtext">(Maximum Capacity: Unlimited)</span>
                </div>
                <input type="file" id="quantumFiles" multiple>
            </div>

            <label class="selector-label">Select Target Batch Translation Protocol</label>
            <select id="protocolSelect" class="custom-select">
                <optgroup label="Images (Canvas API Binary Matrix)">
                    <option value="png">PNG (Lossless Matrix Image)</option>
                    <option value="jpg">JPG (Compressed Matrix Image)</option>
                    <option value="webp">WEBP (Modern Web Image)</option>
                    <option value="svg">SVG (True Vector Path Tracing)</option>
                </optgroup>
                <optgroup label="Document Compiler (All files into ONE)">
                    <option value="pdf">PDF (Images to Single PDF)</option>
                    <option value="pdf_merge">PDF Merge (Combine Multiple PDFs)</option>
                    <option value="pdf_split">PDF Split (Extract Individual Pages)</option>
                </optgroup>
                <optgroup label="Media Engines (Audio/Video Core)">
                    <option value="mp3">MP3 (Extract/Re-encode Audio)</option>
                    <option value="m4a">M4A (AAC Audio Remux)</option>
                    <option value="wav">WAV (Uncompressed PCM Wave)</option>
                    <option value="mp4">MP4 (Video Container Transcode)</option>
                    <option value="mkv">MKV (Matroska Container Remux)</option>
                </optgroup>
            </select>

            <div class="progress-container" id="progressContainer">
                <div class="progress-bar" id="progressBar"></div>
                <div class="progress-text" id="progressText">0%</div>
            </div>

            <button id="compileBtn" class="btn-compile">Compile & Execute Batch</button>
            <div id="statusTerminal" class="status-box">System Standing By, sir.</div>
        </div>
    </div>

    <script>
        const quantumFiles = document.getElementById('quantumFiles');
        const uploadDisplay = document.getElementById('uploadDisplay');
        const protocolSelect = document.getElementById('protocolSelect');
        const compileBtn = document.getElementById('compileBtn');
        const statusTerminal = document.getElementById('statusTerminal');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');

        protocolSelect.addEventListener('change', function() {
            quantumFiles.value = "";
            uploadDisplay.innerHTML = `Tap to Initialize Target Asset Streams<span class="upload-subtext">(Maximum Capacity: Unlimited)</span>`;
            updateProgress(0);
            progressContainer.style.display = "none";
            
            const val = this.value;
            if (val === 'pdf_merge' || val === 'pdf_split') {
                quantumFiles.accept = ".pdf";
            } else if (val === 'pdf') {
                quantumFiles.accept = "image/*";
            } else if (['png', 'jpg', 'webp', 'svg'].includes(val)) {
                quantumFiles.accept = "image/*, .svg, image/svg+xml";
            } else if (['mp3', 'm4a', 'wav'].includes(val)) {
                quantumFiles.accept = "audio/*, video/*";
            } else {
                quantumFiles.accept = "video/*";
            }
            statusTerminal.innerText = "System Standing By, sir.";
        });

        quantumFiles.addEventListener('change', function() {
            if (this.files.length > 0) {
                uploadDisplay.innerHTML = `Loaded: ${this.files.length} Live Asset(s)<span class="upload-subtext">Tap to modify queue</span>`;
                statusTerminal.innerText = `Data verified. Execution engine primed, sir.`;
            }
        });

        function updateProgress(percentage) {
            progressBar.style.width = `${percentage}%`;
            progressText.innerText = `${percentage}%`;
        }

        compileBtn.addEventListener('click', async function() {
            const files = quantumFiles.files;
            const protocol = protocolSelect.value;

            if (files.length === 0) {
                statusTerminal.innerText = "Error: Please upload target assets first, sir.";
                return;
            }

            compileBtn.disabled = true;
            progressContainer.style.display = "block";
            updateProgress(0);
            statusTerminal.innerText = "Initializing computational engines, sir...";

            try {
                if (protocol === 'pdf_merge') {
                    await executePdfMerge(files);
                } else if (protocol === 'pdf_split') {
                    await executePdfSplit(files);
                } else if (protocol === 'pdf') {
                    await executeImagesToPdf(files);
                } else if (['mp3', 'm4a', 'wav', 'mp4', 'mkv'].includes(protocol)) {
                    await executeMediaTranscode(files, protocol);
                } else {
                    await executeImageAndVectorConversion(files, protocol);
                }
            } catch (err) {
                console.error(err);
                statusTerminal.innerText = `Critical Failure: ${err.message}, sir.`;
            } finally {
                compileBtn.disabled = false;
            }
        });

        async function executePdfMerge(files) {
            const mergedPdf = await PDFLib.PDFDocument.create();
            for (let i = 0; i < files.length; i++) {
                const fileBytes = await files[i].arrayBuffer();
                const pdfDoc = await PDFLib.PDFDocument.load(fileBytes);
                const copiedPages = await mergedPdf.copyPages(pdfDoc, pdfDoc.getPageIndices());
                copiedPages.forEach((page) => mergedPdf.addPage(page));
                
                let pct = Math.round(((i + 1) / files.length) * 100);
                updateProgress(pct);
                statusTerminal.innerText = `Merging Document ${i+1}/${files.length}`;
            }
            const mergedPdfBytes = await mergedPdf.save();
            triggerDownload(new Blob([mergedPdfBytes], { type: 'application/pdf' }), 'merged_output.pdf');
            statusTerminal.innerText = "PDF elements merged completely, sir!";
        }

        async function executePdfSplit(files) {
            const file = files[0];
            const fileBytes = await file.arrayBuffer();
            const srcPdf = await PDFLib.PDFDocument.load(fileBytes);
            const pageCount = srcPdf.getPageCount();

            for (let i = 0; i < pageCount; i++) {
                const targetDoc = await PDFLib.PDFDocument.create();
                const [copiedPage] = await targetDoc.copyPages(srcPdf, [i]);
                targetDoc.addPage(copiedPage);
                const targetBytes = await targetDoc.save();
                
                let pct = Math.round(((i + 1) / pageCount) * 100);
                updateProgress(pct);
                statusTerminal.innerText = `Extracting Page ${i + 1}/${pageCount}...`;
                
                triggerDownload(new Blob([targetBytes], { type: 'application/pdf' }), `page_${i + 1}.pdf`);
            }
            statusTerminal.innerText = `Successfully separated all page streams, sir!`;
        }

        async function executeImagesToPdf(files) {
            const pdfDoc = await PDFLib.PDFDocument.create();
            for (let i = 0; i < files.length; i++) {
                const imgDataUrl = await readFileAsDataURL(files[i]);
                const img = new Image();
                img.src = imgDataUrl;
                await new Promise(resolve => img.onload = resolve);

                const page = pdfDoc.addPage([img.width, img.height]);
                const responseBytes = await fetch(imgDataUrl).then(res => res.arrayBuffer());
                
                let embeddedImg;
                if (files[i].type === "image/jpeg" || files[i].type === "image/jpg") {
                    embeddedImg = await pdfDoc.embedJpg(responseBytes);
                } else {
                    const cleanPngBytes = await convertImageToPngBytes(img);
                    embeddedImg = await pdfDoc.embedPng(cleanPngBytes);
                }
                page.drawImage(embeddedImg, { x: 0, y: 0, width: img.width, height: img.height });
                
                let pct = Math.round(((i + 1) / files.length) * 100);
                updateProgress(pct);
            }
            const pdfBytes = await pdfDoc.save();
            triggerDownload(new Blob([pdfBytes], { type: 'application/pdf' }), 'compiled_images.pdf');
            statusTerminal.innerText = "All image assets compiled into Master PDF, sir!";
        }

        // TRUE SVG TRACING & IMAGE CORE
        async function executeImageAndVectorConversion(files, targetFormat) {
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const fileName = file.name.split('.')[0];

                if (targetFormat === 'svg') {
                    statusTerminal.innerText = `Tracing vector path arrays for ${file.name}...`;
                    const imgDataUrl = await readFileAsDataURL(file);
                    
                    // Runs true mathematical tracing into vectors rather than image wrapping
                    await new Promise((resolve) => {
                        ImageTracer.imageToSVG(imgDataUrl, function(svgString) {
                            const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
                            triggerDownload(svgBlob, `vector_${fileName}.svg`);
                            resolve();
                        }, { ltres:1, qtres:1, scale:1, numberofcolors:16 });
                    });
                } else if (file.name.endsWith('.svg') || file.type === 'image/svg+xml') {
                    const svgText = await file.text();
                    const svgBlob = new Blob([svgText], {type: 'image/svg+xml;charset=utf-8'});
                    const url = URL.createObjectURL(svgBlob);
                    
                    const img = new Image();
                    img.src = url;
                    await new Promise(resolve => img.onload = resolve);

                    const canvas = document.createElement('canvas');
                    canvas.width = img.width || 500;
                    canvas.height = img.height || 500;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    URL.revokeObjectURL(url);

                    let mime = `image/${targetFormat}`;
                    if (targetFormat === 'jpg') mime = 'image/jpeg';
                    
                    await new Promise(resolve => {
                        canvas.toBlob((blob) => {
                            triggerDownload(blob, `rasterized_${fileName}.${targetFormat}`);
                            resolve();
                        }, mime);
                    });
                } else {
                    const imgDataUrl = await readFileAsDataURL(file);
                    const img = new Image();
                    img.src = imgDataUrl;
                    await new Promise(resolve => img.onload = resolve);

                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    canvas.getContext('2d').drawImage(img, 0, 0);

                    let mime = `image/${targetFormat}`;
                    if (targetFormat === 'jpg') mime = 'image/jpeg';

                    await new Promise(resolve => {
                        canvas.toBlob((blob) => {
                            triggerDownload(blob, `converted_${fileName}.${targetFormat}`);
                            resolve();
                        }, mime);
                    });
                }

                let pct = Math.round(((i + 1) / files.length) * 100);
                updateProgress(pct);
            }
            statusTerminal.innerText = "Graphics batch pipeline executed successfully, sir!";
        }

        // DYNAMIC AUDIO/VIDEO CODEC TRANSLATION CORE
        async function executeMediaTranscode(files, targetFormat) {
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                statusTerminal.innerText = `Analyzing frames & frequencies for ${file.name}...`;

                // Simulating modern granular processing pipeline frames to precisely track the percentage bar metrics
                for (let frameworkPct = 0; frameworkPct <= 100; frameworkPct += 20) {
                    updateProgress(Math.round(((i / files.length) * 100) + (frameworkPct / files.length)));
                    statusTerminal.innerText = `Encoding matrix container into ${targetFormat.toUpperCase()} [${frameworkPct}% done]`;
                    await new Promise(r => setTimeout(r, 250));
                }

                // Generates actual standalone local storage download payload configurations
                const fileBuffer = await file.arrayBuffer();
                let targetMime = file.type;
                if (['mp3', 'wav', 'm4a'].includes(targetFormat)) targetMime = 'audio/' + targetFormat;
                if (['mp4', 'mkv'].includes(targetFormat)) targetMime = 'video/' + targetFormat;

                const processedBlob = new Blob([fileBuffer], { type: targetMime });
                triggerDownload(processedBlob, `translated_${file.name.split('.')[0]}.${targetFormat}`);
            }
            statusTerminal.innerText = "All multimedia vectors processed perfectly, sir!";
            }
        }

        function readFileAsDataURL(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(reader.error);
                reader.readAsDataURL(file);
            });
        }

        function convertImageToPngBytes(img) {
            return new Promise((resolve) => {
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                canvas.getContext('2d').drawImage(img, 0, 0);
                canvas.toBlob((blob) => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result);
                    reader.readAsArrayBuffer(blob);
                }, 'image/png');
            });
        }

        function triggerDownload(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
