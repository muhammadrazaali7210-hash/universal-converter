<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS Local Processing Core v3.0</title>
    
    <script src="coi-serviceworker.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>

    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-dark: #1e293b;
            --accent-cyan: #22d3ee;
            --accent-blue: #3b82f6;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --error: #ef4444;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        .header-title {
            color: var(--accent-cyan);
            font-size: 1.8rem;
            margin-bottom: 5px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(34, 211, 238, 0.3);
        }

        .header-sub {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 25px;
            text-align: center;
        }

        .engine-container {
            background: var(--panel-dark);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .upload-zone {
            border: 2px dashed var(--accent-blue);
            border-radius: 8px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            background: rgba(59, 130, 246, 0.05);
            transition: 0.3s;
            -webkit-tap-highlight-color: transparent;
        }

        .upload-zone:hover {
            border-color: var(--accent-cyan);
            background: rgba(34, 211, 238, 0.1);
        }

        #file-input { display: none; }

        .file-info {
            margin-top: 15px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
            border-left: 3px solid var(--accent-cyan);
            font-size: 0.85rem;
            display: none;
        }

        .selector-group { margin-top: 20px; }
        
        .selector-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        select {
            width: 100%;
            padding: 12px;
            background: var(--bg-dark);
            color: var(--text-light);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            outline: none;
            font-size: 1rem;
        }

        .btn-execute {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(34, 211, 238, 0.3);
            transition: 0.2s;
        }

        .btn-execute:active { transform: scale(0.98); }

        .terminal-log {
            margin-top: 20px;
            padding: 12px;
            background: #000;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.85rem;
            color: #10b981;
            min-height: 40px;
            text-align: center;
            border: 1px solid #10b981;
        }

        .terminal-error { color: #ef4444; border-color: #ef4444; }
        .terminal-info { color: var(--accent-cyan); border-color: var(--accent-cyan); }
        .terminal-success { color: var(--success); border-color: var(--success); }
        
        canvas { display: none; }
    </style>
</head>
<body>

    <div class="header-title">JARVIS QUANTUM CORE</div>
    <div class="header-sub">True Local Hardware Processing Matrix</div>

    <div class="engine-container">
        <div class="upload-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
            <p>Tap to Initialize Target Asset Data Stream</p>
        </div>
        <input type="file" id="file-input">

        <div class="file-info" id="file-info">
            <strong>Active Asset:</strong> <span id="file-name">None</span><br>
            <strong>Stream Size:</strong> <span id="file-size">0 KB</span>
        </div>

        <div class="selector-group">
            <label>Select Hardware Translation Protocol</label>
            <select id="format-selector">
                <optgroup label="Images (Canvas API Binary Matrix)">
                    <option value="png" selected>PNG (Lossless Matrix Image)</option>
                    <option value="jpg">JPG (Compressed Matrix Image)</option>
                    <option value="webp">WEBP (Modern Web Image)</option>
                </optgroup>
                <optgroup label="Documents (Structural XML/Vector Layouts)">
                    <option value="pdf">PDF (True Vector Adobe Layout)</option>
                    <option value="docx">DOCX (OpenXML Word Document)</option>
                    <option value="pptx">PPTX (OpenXML Presentation Slide)</option>
                    <option value="txt">TXT (Raw Plain Text Stream)</option>
                </optgroup>
                <optgroup label="Media (FFmpeg WebAssembly Core)">
                    <option value="mp3">MP3 (True Audio Layer Rewrite)</option>
                    <option value="m4a">M4A (AAC Audio Container)</option>
                    <option value="wav">WAV (Uncompressed Audio PCM)</option>
                    <option value="mp4">MP4 (True H.264 Video Encode)</option>
                    <option value="mkv">MKV (Matroska Media Container)</option>
                </optgroup>
            </select>
        </div>

        <button class="btn-execute" onclick="executeLocalConversion()">Compile & Execute Engine</button>

        <div class="terminal-log terminal-info" id="terminal">System Standing By, sir.</div>
    </div>

    <canvas id="render-canvas"></canvas>

    <script>
        let currentAsset = null;
        const terminal = document.getElementById('terminal');

        if (window['pdfjs-dist/build/pdf']) {
            window['pdfjs-dist/build/pdf'].GlobalWorkerOptions.workerSrc = '';
        }

        function logToTerminal(message, type = "info") {
            terminal.innerText = message;
            terminal.className = `terminal-log terminal-${type}`;
        }

        document.getElementById('file-input').addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                currentAsset = e.target.files[0];
                document.getElementById('file-name').innerText = currentAsset.name;
                document.getElementById('file-size').innerText = (currentAsset.size / 1024).toFixed(2) + " KB";
                document.getElementById('file-info').style.display = "block";
                logToTerminal("Target stream read and validated successfully, sir.", "success");
            }
        });

        async function executeLocalConversion() {
            if (!currentAsset) return logToTerminal("Error: Target asset data stream is empty, sir.", "error");
            
            const targetFormat = document.getElementById('format-selector').value;
            const originalName = currentAsset.name.split('.')[0];
            const fileType = currentAsset.type || currentAsset.name.toLowerCase();

            logToTerminal(`Routing asset data stream into .${targetFormat} compilation cells...`, "info");

            try {
                // Route 1: PDF to Image Extraction Engine
                if ((fileType.includes('pdf') || currentAsset.name.toLowerCase().endsWith('.pdf')) && ['png', 'jpg', 'webp'].includes(targetFormat)) {
                    await processPdfToImageLocally(currentAsset, targetFormat, originalName);
                }
                // Route 2: Image Engine Matrix
                else if (['png', 'jpg', 'webp'].includes(targetFormat)) {
                    await processImageLocally(currentAsset, targetFormat, originalName);
                } 
                // Route 3: Vector PDF Engine
                else if (targetFormat === 'pdf') {
                    await processPdfLocally(currentAsset, originalName);
                } 
                // Route 4: Text Documents
                else if (['docx', 'pptx', 'txt'].includes(targetFormat)) {
                    if (fileType.includes('image') || fileType.includes('pdf') || currentAsset.name.toLowerCase().endsWith('.pdf')) {
                        logToTerminal("OCR Engine required to unroll pixels into text documents. Execution aborted, sir.", "error");
                        return;
                    }
                    if (targetFormat === 'txt') {
                        await processTxtLocally(currentAsset, originalName);
                    } else {
                        await processOfficeXmlLocally(currentAsset, targetFormat, originalName);
                    }
                } 
                // Route 5: Media Transcoding Engine
                else if (['mp3', 'm4a', 'wav', 'mp4', 'mkv'].includes(targetFormat)) {
                    await processMediaLocally(currentAsset, targetFormat, originalName);
                }
            } catch (error) {
                console.error(error);
                logToTerminal("Hardware processing exception. Operation halted, sir.", "error");
            }
        }

        // PIPELINE 1: IMAGE PROCESSING MATRIX
        function processImageLocally(file, format, baseName) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.getElementById('render-canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = img.width;
                        canvas.height = img.height;
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        ctx.drawImage(img, 0, 0);
                        
                        let mime = 'image/png';
                        if (format === 'jpg') mime = 'image/jpeg';
                        if (format === 'webp') mime = 'image/webp';

                        canvas.toBlob((blob) => {
                            if (!blob) return reject("Data matrix compression failed.");
                            triggerDownload(URL.createObjectURL(blob), `${baseName}.${format}`);
                            logToTerminal(`Image structure recompiled to .${format}, sir!`, "success");
                            resolve();
                        }, mime, 0.95);
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        // PIPELINE 2: COMPLETE PDF RASTERIZATION ENGINE
        function processPdfToImageLocally(file, targetFormat, originalName) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                logToTerminal("Activating internal layout engine. Parsing document bytes...", "info");
                
                reader.onload = function(e) {
                    window['pdfjs-dist/build/pdf'].getDocument({
                        data: new Uint8Array(e.target.result)
                    }).promise.then(function(pdf) {
                        
                        pdf.getPage(1).then(function(page) {
                            const canvas = document.getElementById('render-canvas');
                            const ctx = canvas.getContext('2d');
                            
                            const viewport = page.getViewport({ scale: 2.0 });
                            canvas.width = viewport.width;
                            canvas.height = viewport.height;
                            
                            const renderContext = {
                                canvasContext: ctx,
                                viewport: viewport
                            };
                            
                            page.render(renderContext).promise.then(function() {
                                let mime = 'image/png';
                                if (targetFormat === 'jpg') mime = 'image/jpeg';
                                if (targetFormat === 'webp') mime = 'image/webp';

                                canvas.toBlob((blob) => {
                                    if (!blob) {
                                        logToTerminal("Matrix generation failed.", "error");
                                        reject("Blob failed");
                                        return;
                                    }
                                    triggerDownload(URL.createObjectURL(blob), `${originalName}_page1.${targetFormat}`);
                                    logToTerminal(`PDF page successfully sliced into clean .${targetFormat}, sir!`, "success");
                                    resolve();
                                }, mime, 0.95);
                            });
                        });
                    }).catch(reject);
                };
                reader.readAsArrayBuffer(file);
            });
        }

        // PIPELINE 3: VECTOR PDF COMPILER
        async function processPdfLocally(file, baseName) {
            const pdfDoc = await PDFLib.PDFDocument.create();
            const page = pdfDoc.addPage([600, 800]);
            const arrayBuffer = await file.arrayBuffer();
            const type = file.type || file.name.toLowerCase();

            if (type.includes('image') || ['png', 'jpg', 'jpeg', 'webp'].some(ext => file.name.toLowerCase().endsWith(ext))) {
                logToTerminal("Embedding pixel grids into vector layer spaces...", "info");
                let imageEmbed;
                if (type.includes('png')) imageEmbed = await pdfDoc.embedPng(arrayBuffer);
                else imageEmbed = await pdfDoc.embedJpg(arrayBuffer);
                
                const ratio = Math.min(500 / imageEmbed.width, 700 / imageEmbed.height);
                const w = imageEmbed.width * ratio;
                const h = imageEmbed.height * ratio;
                page.drawImage(imageEmbed, { x: 50, y: 800 - h - 50, width: w, height: h });
            } else {
                logToTerminal("Writing character strings onto standard sheets...", "info");
                const text = await file.text();
                page.drawText(text.substring(0, 2000), { x: 50, y: 750, size: 12, maxWidth: 500 });
            }

            const pdfBytes = await pdfDoc.save();
            const blob = new Blob([pdfBytes], { type: 'application/pdf' });
            triggerDownload(URL.createObjectURL(blob), `${baseName}.pdf`);
            logToTerminal("Flawless structural vector PDF generated, sir!", "success");
        }

        // PIPELINE 4: MICROSOFT OPENXML DOCUMENT ENGINE (DOCX / PPTX)
        async function processOfficeXmlLocally(file, format, baseName) {
            logToTerminal(`Weaving text strings into strict .${format} schema matrices...`, "info");
            const text = await file.text();
            const safeText = text.replace(/[<>&'"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','\'':'&apos;','"':'&quot;'}[c] || c));
            
            const zip = new JSZip();
            
            if (format === 'docx') {
                zip.file("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`);
                zip.file("_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`);
                const wordFolder = zip.folder("word");
                wordFolder.file("document.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body><w:p><w:r><w:t>${safeText}</w:t></w:r></w:p></w:body></w:document>`);
            } else if (format === 'pptx') {
                zip.file("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Override PartName="/unpacked/slide.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slide+xml"/></Types>`);
                const pptFolder = zip.folder("unpacked");
                pptFolder.file("slide.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><p:sld xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main"><p:cSld><p:spTree><p:sp><p:txBody><a:bodyPr/><a:p><a:r><a:t>${safeText}</a:t></a:r></a:p></p:txBody></p:sp></p:spTree></p:cSld></p:sld>`);
            }

            const content = await zip.generateAsync({ type: "blob" });
            const mimeType = format === 'docx' ? 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' : 'application/vnd.openxmlformats-officedocument.presentationml.presentation';
            triggerDownload(URL.createObjectURL(new Blob([content], {type: mimeType})), `${baseName}.${format}`);
            logToTerminal(`Genuine OpenXML archive compiled to .${format}, sir!`, "success");
        }

        // PIPELINE 5: RAW TEXT GENERATOR
        async function processTxtLocally(file, baseName) {
            const text = await file.text();
            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            triggerDownload(URL.createObjectURL(blob), `${baseName}.txt`);
            logToTerminal("Plain text stream written down cleanly, sir!", "success");
        }

        // PIPELINE 6: ADVANCED MEDIA TRANSCODING (FFMPEG CORES)
        async function processMediaLocally(file, targetFormat, originalName) {
            logToTerminal("Booting high-performance WebAssembly virtual core...", "info");
            const { createFFmpeg, fetchFile } = FFmpeg;
            const ffmpeg = createFFmpeg({ log: true, corePath: 'https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js' });
            
                       // --- CONTINUATION FROM LINE 418 ---
            await ffmpeg.load();
            logToTerminal(`Processor ready. Transcoding frames to .${targetFormat}...`, "info");
            
            const inName = 'input.' + file.name.split('.').pop();
            const outName = `output.${targetFormat}`;
            const fileType = file.type || file.name.toLowerCase();
            
            ffmpeg.FS('writeFile', inName, await fetchFile(file));
            
            const isAudioInput = fileType.includes('audio') || ['mp3', 'wav', 'm4a', 'ogg'].some(ext => file.name.toLowerCase().endsWith(ext));
            const isVideoOutput = ['mp4', 'mkv'].includes(targetFormat);

            // Audio to Video Block: Infuses uniform black background matrix frames
            if (isAudioInput && isVideoOutput) {
                logToTerminal("Audio track detected for video profile. Compiling black background matrix grids...", "info");
                await ffmpeg.run('-f', 'lavfi', '-i', 'color=c=black:s=640x480:r=30', '-i', inName, '-c:v', 'libx264', '-tune', 'stillimage', '-c:a', 'aac', '-b:a', '128k', '-pix_fmt', 'yuv420p', '-shortest', outName);
            } else {
                await ffmpeg.run('-i', inName, outName);
            }
            
            const data = ffmpeg.FS('readFile', outName);
            
            let mime = 'video/mp4';
            if (targetFormat === 'mp3') mime = 'audio/mpeg';
            if (targetFormat === 'm4a') mime = 'audio/mp4';
            if (targetFormat === 'wav') mime = 'audio/wav';
            if (targetFormat === 'mkv') mime = 'video/x-matroska';

            triggerDownload(URL.createObjectURL(new Blob([data.buffer], { type: mime })), `${originalName}.${targetFormat}`);
            logToTerminal("Media packets natively transcoded and rewritten, sir!", "success");
            
            ffmpeg.FS('unlink', inName);
            ffmpeg.FS('unlink', outName);
        }

        // UTILITY: SYSTEM DOWNLOAD CONTROLLER
        function triggerDownload(url, filename) {
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
